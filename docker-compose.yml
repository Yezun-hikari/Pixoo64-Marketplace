services:
  hub:
    image: ghcr.io/yezun-hikari/pixoo64-marketplace:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Everything the hub stores (settings, installed plugins, their data)
    # lives in this one directory and survives image updates.
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Berlin   # used for quiet hours
    # Automatic discovery of the Pixoo needs the host network on Linux.
    # Alternatively remove "ports" above, uncomment this line, or just enter
    # the Pixoo's IP in the web UI.
    # network_mode: host
